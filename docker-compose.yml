version: '3.8'

services:
  # ============================================================================
  # API SERVER (FastAPI + Uvicorn)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-aftercare-api
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - POSTGRES_URL=postgresql://aftercare:${POSTGRES_PASSWORD:-aftercare}@postgres:5432/aftercare
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
      - LLM_ENABLED=true
      - NOTE_DEMO_MODE=${NOTE_DEMO_MODE:-}   # 1 = recorded v4 notes, no GPU needed (labelled DEMO)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./triage_scorer.py:/app/triage_scorer.py
      - ./api.py:/app/api.py
      - ./db.py:/app/db.py
      - ./note_generator_aftercare.py:/app/note_generator_aftercare.py
    networks:
      - ai-aftercare
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # FRONTEND (Streamlit)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-aftercare-frontend
    ports:
      - "0.0.0.0:8501:8501"
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    networks:
      - ai-aftercare

  # ============================================================================
  # PATIENT PAGE (Streamlit, separate app: no nurse tools, no triage details)
  # ============================================================================
  patient:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-aftercare-patient
    command: ["streamlit", "run", "patient.py", "--server.port=8502", "--server.address=0.0.0.0",
              "--server.headless=true", "--server.enableCORS=false"]
    ports:
      - "0.0.0.0:8502:8502"
    environment:
      - API_URL=http://api:8000
      - CLINIC_PHONE=${CLINIC_PHONE:-}
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    networks:
      - ai-aftercare
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # LLM ENGINE (Ollama)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ai-aftercare-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - ai-aftercare
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: serve

  # ============================================================================
  # DATABASE (PostgreSQL)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ai-aftercare-postgres
    environment:
      - POSTGRES_USER=aftercare
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aftercare}
      - POSTGRES_DB=aftercare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ai-aftercare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftercare"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # CACHE (Redis)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ai-aftercare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-aftercare
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # MONITORING (Prometheus)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-aftercare-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - ai-aftercare

  # ============================================================================
  # DASHBOARDS (Grafana)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ai-aftercare-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ai-aftercare

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  ollama_data:

networks:
  ai-aftercare:
    driver: bridge
