# AWS single-instance deployment (one GPU EC2 machine, e.g. g5.xlarge). Step by step: docs/AWS_DEPLOY.md
#
#   docker compose -f docker-compose.aws.yml up -d --build
#
# Differences from docker-compose.yml (local development):
#   * Only Caddy is reachable from the internet (ports 80/443): HTTPS plus a username/password gate.
#   * The API, PostgreSQL, Redis and Ollama have NO published ports. Containers talk over the private network.
#   * The API container gets the GPU, so draft notes are generated by the real v4 adapter.
#   * No source-code bind mounts: the images contain the code (rebuild with --build after a change).
#   * Prometheus and Grafana are optional (profile "monitoring") and only listen on 127.0.0.1 of the server;
#     reach them through an SSH tunnel.
#   * Required passwords come from .env (see .env.example). The file refuses to start without them.
#
# Prototype security: the basic-auth gate keeps casual visitors out. It is NOT a HIPAA control.
# Use synthetic data only.

services:
  # ============================================================================
  # HTTPS + password gate (the only public entry point)
  # ============================================================================
  caddy:
    image: caddy:2
    container_name: ai-aftercare-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?set SITE_ADDRESS in .env (a domain name pointing at this server)}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env (see docs/AWS_DEPLOY.md)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # keeps the HTTPS certificate across restarts
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - ai-aftercare

  # ============================================================================
  # FRONTEND (Streamlit nurse dashboard) - reached only through Caddy
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-aftercare-frontend
    restart: unless-stopped
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    networks:
      - ai-aftercare

  # ============================================================================
  # API SERVER (FastAPI + Llama-2-7B with the v4 LoRA adapter, on the GPU)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-aftercare-api
    restart: unless-stopped
    environment:
      - POSTGRES_URL=postgresql://aftercare:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aftercare
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
      - LLM_ENABLED=true
      - NOTE_DEMO_MODE=${NOTE_DEMO_MODE:-}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - hf_cache:/root/.cache/huggingface   # the 13 GB base model is downloaded once, then reused
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - ai-aftercare
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================================
  # CHAT MODEL (Ollama) - shares the GPU with the note model (about 4 GB of the 24 GB on a g5.xlarge)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ai-aftercare-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ai-aftercare
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: serve

  # ============================================================================
  # DATABASE (PostgreSQL) - no published port
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ai-aftercare-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aftercare
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=aftercare
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ai-aftercare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftercare"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # CACHE (Redis) - no published port
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ai-aftercare-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ai-aftercare
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # MONITORING (optional): docker compose -f docker-compose.aws.yml --profile monitoring up -d
  # Listens on the server's localhost only. From your PC:  ssh -L 3000:localhost:3000 ubuntu@<server>
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-aftercare-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - ai-aftercare

  grafana:
    image: grafana/grafana:latest
    container_name: ai-aftercare-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ai-aftercare

volumes:
  caddy_data:
  caddy_config:
  hf_cache:
  ollama_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  ai-aftercare:
    driver: bridge
