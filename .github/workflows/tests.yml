name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m py_compile api.py db.py demo.py note_generator_aftercare.py triage_scorer.py
      - name: Database layer + note guards
        run: python -m pytest -q tests/test_store.py tests/test_note_generator.py
      - name: Dashboard code paths (fake Streamlit)
        run: python tests/test_demo.py

  api-tests:
    name: API tests (FastAPI TestClient)
    runs-on: ubuntu-latest
    # tests/test_api.py was written before it could be run. Remove continue-on-error once it passes here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_api.py

  compose:
    name: compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config -q
      - run: docker compose -f docker-compose.prod.yml config -q
